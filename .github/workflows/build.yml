name: Build Windows Executable

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -vvv -r requirements.txt

    - name: Build with PyInstaller
      run: |
        python build_exe.py

    - name: Recreate PFX
      shell: powershell
      run: |
          [System.IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\ghostshadow.pfx",
            [System.Convert]::FromBase64String("${{ secrets.CERT_PFX }}")
            )

    - name: Locate SignTool
      shell: powershell
      run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe |
            Select-Object -First 1 -ExpandProperty FullName
      
          if (-not $signtool) {
            throw "signtool.exe not found"
          }
      
          Write-Host "Found SignTool: $signtool"
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

    - name: Sign EXE
      shell: powershell
      run: |
          & "$env:SIGNTOOL_PATH" sign `
            /f "$env:RUNNER_TEMP\ghostshadow.pfx" `
            /p "${{ secrets.CERT_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            dist\GhostTuneConverter.exe

    - name: Verify Signature
      shell: powershell
      run: |
          Get-AuthenticodeSignature `
            dist\GhostTuneConverter.exe | Format-List
            

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: GhostTuneConverter-Windows
        path: dist/GhostTuneConverter.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: GhostTuneConverter-Windows
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: GhostTuneConverter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
